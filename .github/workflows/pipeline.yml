name: News pipeline

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes (UTC); GitHub may start it a few minutes late
  workflow_dispatch: {} # "Run workflow" button for manual runs

# Never run two pipelines at once; a late run waits instead of duplicating work.
concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Ingest feeds and group stories
        run: npm run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
