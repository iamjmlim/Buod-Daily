name: News pipeline

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes (UTC); GitHub may start it a few minutes late
  workflow_dispatch: {} # "Run workflow" button for manual runs

# Never run two pipelines at once; a late run waits instead of duplicating work.
concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  models: read # lets GITHUB_TOKEN call GitHub Models (free backup AI)

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Ingest feeds and group stories
        run: npm run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Summarize, check and publish
        run: npm run summarize
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_PROVIDER: gemini
          AI_FALLBACK_PROVIDER: github
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT || '100' }}
          STORIES_PER_RUN: ${{ vars.STORIES_PER_RUN || '6' }}
